<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Universal MicroFoundary stylesheet -->
    <link rel="stylesheet" href="universal.css" />

    <title>AutoFormatter – MicroFoundary</title>

    <style>
        /* iPhone Chrome fallback protection */
        body {
            background: #ffffff;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .mf-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 0;
        }

        .mf-header img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .mf-title {
            font-size: 24px;
            font-weight: 600;
        }

        .mf-subtitle {
            font-size: 16px;
            font-weight: 400;
            opacity: 0.7;
        }

        /* Text areas */
        textarea {
            width: 100%;
            min-height: 140px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            background: #ffffff;
        }

        /* Button */
        .mf-button {
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            padding: 14px;
            font-size: 18px;
            border-radius: 10px;
            margin-top: 16px;
            cursor: pointer;
        }

        .mf-button:active {
            background: #005fcc;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- Header -->
        <div class="mf-header">
            <img src="IMG_1669.jpeg" alt="MicroFoundary Logo" />
            <div>
                <div class="mf-title">MicroFoundary</div>
                <div class="mf-subtitle">AutoFormatter</div>
            </div>
        </div>

        <!-- Input -->
        <textarea id="inputBox" placeholder="Paste text here..."></textarea>

        <!-- Button -->
        <button class="mf-button" onclick="formatText()">Format</button>

        <!-- Output -->
        <textarea id="outputBox" placeholder="Formatted text appears here..."></textarea>

    </div>

    <script>
        function formatText() {
            const input = document.getElementById("inputBox").value;

            // Simple formatting example — you can replace this with your logic
            const formatted = input
                .trim()
                .replace(/\s+/g, " ")
                .replace(/\n{2,}/g, "\n\n");

            document.getElementById("outputBox").value = formatted;
        }
    </script>
</body>
</html>

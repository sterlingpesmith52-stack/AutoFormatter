<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoFormatter</title>

  <style>
    /* Entire page background must be white */
    body {
      font-family: Arial, sans-serif;
      background: white;        /* ✔ fixed */
      margin: 20px;
    }

    /* Panel matches Clarifier exactly */
    .panel {
      background: white;        /* ✔ fixed */
      padding: 20px;
      border-radius: 10px;
      max-width: 480px;
    }

    /* Title matches Clarifier: bold + left-aligned + correct size */
    h1 {
      margin: 0 0 15px 0;
      text-align: left;
      font-size: 22px;
      font-weight: bold;        /* ✔ fixed */
      background: none;         /* ✔ fixed */
    }

    /* Input area matches Clarifier exactly */
    textarea {
      width: 100%;              /* ✔ fixed width */
      height: 140px;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;   /* ✔ gray border */
      resize: none;
      margin-bottom: 12px;
      outline: none;            /* ✔ removes blue highlight */
    }

    /* Remove blue border on focus */
    textarea:focus {
      border: 1px solid #ccc;   /* ✔ stays gray */
      outline: none;            /* ✔ no blue glow */
    }

    /* Button matches Clarifier brand */
    button {
      display: inline-block;
      padding: 8px 14px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #0078d4;
      color: white;
      cursor: pointer;
      text-align: left;
      margin-bottom: 15px;
    }

    /* Output area matches Clarifier */
    #output {
      background: white;
      border-radius: 6px;
      padding: 10px;
      min-height: 120px;
      border: 1px solid #ccc;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h1>AutoFormatter</h1>

    <textarea id="input" placeholder="Paste text here..."></textarea>

    <button onclick="formatText()">Format</button>

    <div id="output"></div>
  </div>

  <script>
    function formatText() {
      let text = document.getElementById("input").value;

      text = text.trim();
      text = text.replace(/\s+/g, " ");
      text = text.replace(/\. /g, ".\n");
      text = text.replace(/(^\w|\.\s+\w)/g, match => match.toUpperCase());

      document.getElementById("output").innerText = text;
    }
  </script>
</body>
</html>

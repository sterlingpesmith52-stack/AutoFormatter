<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoFormatter</title>

<!-- Universal Stylesheet -->
<link rel="stylesheet" href="universal.css">

<style>
    body {
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
    }

    .header {
        display: flex;
        align-items: center;
        padding: 14px;
        border-bottom: 2px solid #000;
    }

    .logo {
        height: 48px;
        width: auto;
        margin-right: 12px;
    }

    .title {
        font-size: 24px;
        font-weight: 600;
    }

    .container {
        padding: 16px;
    }

    textarea {
        width: 100%;
        height: 160px;
        font-size: 16px;
        padding: 10px;
        border: 2px solid #000;
        border-radius: 6px;
        box-sizing: border-box;
    }

    .button {
        margin-top: 14px;
        padding: 12px 18px;
        background: #000;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 18px;
        width: 100%;
        cursor: pointer;
    }

    .output {
        margin-top: 18px;
        padding: 12px;
        border: 2px solid #000;
        border-radius: 6px;
        min-height: 120px;
        background: #fafafa;
        font-size: 16px;
        white-space: pre-wrap;
    }
</style>

</head>
<body>

<div class="header">
    <img src="IMG_1741.jpeg" class="logo">
    <div class="title">AutoFormatter</div>
</div>

<div class="container">
    <textarea id="inputBox" placeholder="Paste text here…"></textarea>
    <button class="button" onclick="formatText()">Format</button>
    <div id="outputBox" class="output"></div>
</div>

<script>
function formatText() {
    let text = document.getElementById("inputBox").value;

    // Remove stray "in" bug and normalize spacing
    text = text.replace(/\bin\b\s*$/gm, "");
    text = text.replace(/\s+/g, " ").trim();

    // Basic formatting rules
    text = text.replace(/\. /g, ".\n");
    text = text.replace(/; /g, ";\n");
    text = text.replace(/: /g, ":\n");

    document.getElementById("outputBox").innerText = text;
}
</script>

</body>
</html>

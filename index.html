<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroFoundary AutoFormatter</title>

<style>
    body {
        background-color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
    }

    .mf-header {
        display: flex;
        align-items: center;
        padding: 12px 16px;
    }

    .mf-logo {
        height: 48px;
        width: auto;
        margin-right: 10px;
    }

    .mf-title {
        font-size: 24px;
        font-weight: 600;
        margin: 0;
        padding: 0;
    }

    .container {
        padding: 16px;
        text-align: left;
    }

    textarea {
        width: 100%;
        height: 140px;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
    }

    button {
        display: inline-block;
        margin: 0;
        margin-top: 12px;
        padding: 10px 18px;
        font-size: 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        text-align: left;
    }

    #output {
        margin-top: 12px;
        padding: 10px;
        min-height: 140px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        white-space: pre-wrap;
        box-sizing: border-box;
    }
</style>

</head>
<body>

<div class="mf-header">
    <img src="IMG_1741.jpeg" class="mf-logo">
    <h1 class="mf-title">AutoFormatter</h1>
</div>

<div class="container">
    <textarea id="input" placeholder="Paste text here..."></textarea>

    <button onclick="formatText()">Format</button>

    <div id="output">Formatted text appears here...</div>
</div>

<script>
function formatText() {
    const raw = document.getElementById("input").value;

    // Basic formatting example — replace multiple spaces with one
    const formatted = raw.replace(/\s+/g, " ").trim();

    document.getElementById("output").textContent = formatted;
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AutoFormatter</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: white;
    margin: 0;
    padding: 20px;
    color: #222;
  }

  h1 {
    text-align: center;
    color: #1a73e8;
    margin-bottom: 20px;
  }

  #inputText {
    width: 100%;
    height: 220px;
    padding: 14px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: none;
    box-sizing: border-box;
  }

  .buttonRow {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 18px;
  }

  /* PRIMARY BUTTON — FORMAT */
  #formatButton {
    background: #1a73e8;
    color: white;
    border: none;
    padding: 14px 20px;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.18);
    transition: all 0.15s ease;
  }

  #formatButton:hover {
    background: #1666d1;
    transform: translateY(-1px);
  }

  #formatButton:active {
    background: #145bbf;
    transform: translateY(0);
  }

  /* SECONDARY BUTTON — CLEAR (de‑emphasized) */
  #clearButton {
    background: #e9e9e9;
    color: #444;
    border: 1px solid #ccc;
    padding: 10px 16px;
    font-size: 15px;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: none;
    transition: background 0.15s ease;
  }

  #clearButton:hover {
    background: #dcdcdc;
  }

  #clearButton:active {
    background: #d0d0d0;
  }
</style>

</head>
<body>

<h1>AutoFormatter</h1>

<textarea id="inputText" placeholder="Paste messy text here…"></textarea>

<div class="buttonRow">
  <button id="formatButton">Format</button>
  <button id="clearButton">Clear</button>
</div>

<script>
  document.getElementById("formatButton").addEventListener("click", () => {
    let text = document.getElementById("inputText").value;

    // Basic cleanup rules
    text = text.replace(/\s+/g, " ").trim();        // collapse whitespace
    text = text.replace(/\n{3,}/g, "\n\n");         // limit blank lines
    text = text.replace(/\.{3,}/g, "...");          // normalize ellipses

    document.getElementById("inputText").value = text;
  });

  document.getElementById("clearButton").addEventListener("click", () => {
    document.getElementById("inputText").value = "";
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoFormatter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 200px;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      resize: none;
    }
    button {
      margin-top: 10px;
      padding: 10px 15px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #0078d4;
      color: white;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #005ea0;
    }
    #output {
      margin-top: 20px;
      padding: 10px;
      background: white;
      border-radius: 6px;
      min-height: 150px;
      white-space: pre-wrap;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>AutoFormatter</h1>

  <textarea id="input" placeholder="Paste text here..."></textarea>
  <button onclick="formatText()">Format</button>

  <div id="output"></div>

  <script>
    function formatText() {
      let text = document.getElementById("input").value;

      // Trim extra spaces
      text = text.trim();

      // Replace multiple spaces with single
      text = text.replace(/\s+/g, " ");

      // Add line breaks after periods
      text = text.replace(/\. /g, ".\n");

      // Capitalize first letter of each sentence
      text = text.replace(/(^\w|\.\s+\w)/g, match => match.toUpperCase());

      document.getElementById("output").innerText = text;
    }
  </script>
</body>
</html>

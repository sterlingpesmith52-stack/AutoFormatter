<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AutoFormatter Microwidget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #ffffff;
      --panel: #f7f7f7;
      --accent: #007aff;
      --accent-soft: rgba(0, 122, 255, 0.12);
      --text-main: #1a1a1a;
      --text-muted: #555555;
      --border: #dcdcdc;
      --danger: #ff4d4f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      color: var(--text-main);
      padding: 20px;
    }

    .widget-shell {
      width: 100%;
      max-width: 720px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 1.6rem;
      color: var(--accent);
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 160px;
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      resize: vertical;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: #clearButton {
  background: #e9e9e9;        /* soft gray */
  color: #444;
  border: 1px solid #ccc;
  padding: 8px 14px;          /* smaller than Format */
  border-radius: 6px;
  box-shadow: none;           /* no urgency */
  cursor: pointer;
  font-size: 14px;            /* slightly smaller text */
}

#clearButton:hover {
  background: #dcdcdc;
}

#clearButton:active {
  background: #d0d0d0;
}

;
    }

    .output {
      margin-top: 20px;
      padding: 12px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 120px;
      white-space: pre-wrap;
      color: var(--text-main);
    }
  </style>
</head>

<body>
  <div class="widget-shell">
    <h1>AutoFormatter</h1>

    <textarea id="input" placeholder="Paste messy text here..."></textarea>

    <button onclick="formatText()">Format</button>
    <button class="clear" onclick="clearAll()">Clear</button>

    <div id="output" class="output"></div>
  </div>

  <script>
    function formatText() {
      let text = document.getElementById("input").value;

      // Remove double spaces
      text = text.replace(/ {2,}/g, " ");

      // Normalize line breaks
      text = text.replace(/\n{2,}/g, "\n");

      // Trim leading/trailing whitespace
      text = text.trim();

      // Fix space before punctuation
      text = text.replace(/ \./g, ".");
      text = text.replace(/ ,/g, ",");
      text = text.replace(/ !/g, "!");
      text = text.replace(/ \?/g, "?");

      document.getElementById("output").textContent = text;
    }

    function clearAll() {
      document.getElementById("input").value = "";
      document.getElementById("output").textContent = "";
    }
  </script>
</body>
</html>

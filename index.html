<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoFormatter</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 20px;
    }

    .panel {
      background: #e8e8e8;
      padding: 20px;
      border-radius: 10px;
      max-width: 480px;
    }

    h1 {
      margin: 0 0 15px 0;
      text-align: left;
      font-size: 22px;      /* ✔ matches Clarifier */
      font-weight: normal;  /* ✔ matches Clarifier */
      background: none;     /* ✔ removes gray background */
    }

    textarea {
      width: 100%;
      height: 140px;        /* ✔ fits the panel like Clarifier */
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;  /* ✔ removes blue border */
      resize: none;
      margin-bottom: 12px;
    }

    button {
      display: inline-block;
      padding: 8px 14px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #0078d4;
      color: white;
      cursor: pointer;
      text-align: left;
      margin-bottom: 15px;
    }

    #output {
      background: white;
      border-radius: 6px;
      padding: 10px;
      min-height: 120px;
      border: 1px solid #ccc;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h1>AutoFormatter</h1>

    <textarea id="input" placeholder="Paste text here..."></textarea>

    <button onclick="formatText()">Format</button>

    <div id="output"></div>
  </div>

  <script>
    function formatText() {
      let text = document.getElementById("input").value;

      text = text.trim();
      text = text.replace(/\s+/g, " ");
      text = text.replace(/\. /g, ".\n");
      text = text.replace(/(^\w|\.\s+\w)/g, match => match.toUpperCase());

      document.getElementById("output").innerText = text;
    }
  </script>
</body>
</html>

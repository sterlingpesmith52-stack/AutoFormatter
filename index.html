<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AutoFormatter Microwidget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #0f172a;
      --panel: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --border: #1f2937;
      --danger: #f97373;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b 0, #020617 55%, #000 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      color: var(--text-main);
      padding: 20px;
    }

    .widget-shell {
      width: 100%;
      max-width: 720px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 40px rgba(0,0,0,0.4);
    }

    h1 {
      margin-top: 0;
      font-size: 1.6rem;
      color: var(--accent);
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 160px;
      background: #0f172a;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      resize: vertical;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }

    button.clear {
      background: var(--danger);
      color: #000;
    }

    .output {
      margin-top: 20px;
      padding: 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 120px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="widget-shell">
    <h1>AutoFormatter</h1>

    <textarea id="input" placeholder="Paste messy text here..."></textarea>

    <button onclick="formatText()">Format</button>
    <button class="clear" onclick="clearAll()">Clear</button>

    <div id="output" class="output"></div>
  </div>

  <script>
    function formatText() {
      let text = document.getElementById("input").value;

      // Remove double spaces
      text = text.replace(/ {2,}/g, " ");

      // Normalize line breaks
      text = text.replace(/\n{2,}/g, "\n");

      // Trim leading/trailing whitespace
      text = text.trim();

      // Fix space before punctuation
      text = text.replace(/ \./g, ".");
      text = text.replace(/ ,/g, ",");
      text = text.replace(/ !/g, "!");
      text = text.replace(/ \?/g, "?");

      document.getElementById("output").textContent = text;
    }

    function clearAll() {
      document.getElementById("input").value = "";
      document.getElementById("output").textContent = "";
    }
  </script>
</body>
</html>

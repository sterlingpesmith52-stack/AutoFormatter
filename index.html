<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroFoundary AutoFormatter</title>

<style>
body{
    background:#ffffff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    margin:0;
    padding:0;
    padding-bottom:90px;
}

.mf-header{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    padding:20px 16px 16px 16px;
}

.mf-logo{
    height:32px;
    width:auto;
    margin-bottom:10px;
}

.mf-title{
    font-size:24px;
    font-weight:600;
    margin:0;
    padding:0;
}

.subtitle{
    font-size:15px;
    opacity:.8;
    margin-top:6px;
    margin-bottom:12px;
}

.container{
    padding:0 16px 16px 16px;
    text-align:left;
}

textarea{
    width:100%;
    height:160px;
    padding:10px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
    font-family:inherit;
}

.button-row{
    display:flex;
    gap:8px;
    margin-top:12px;
}

button{
    padding:8px 12px;
    font-size:14px;
    font-weight:600;
    background:#007aff;
    color:#ffffff;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

#output{
    margin-top:12px;
    padding:10px;
    min-height:140px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
    white-space:pre-wrap;
    box-sizing:border-box;
}

.footer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#ffffff;
    border-top:1px solid #d1d5db;
    padding:10px 12px;
    text-align:center;
}

.buy-button{
    display:inline-block;
    background:#007aff;
    color:#ffffff;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    padding:10px 18px;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="mf-header">

    <img
        src="IMG_1741.jpeg"
        alt="MicroFoundary Logo"
        class="mf-logo"
    >

    <h1 class="mf-title">
        AutoFormatter
    </h1>

    <div class="subtitle">
        Clean, organize, and polish text in seconds.
    </div>

</div>

<div class="container">

    <textarea
        id="input"
        placeholder="Paste text here..."
    ></textarea>

    <div class="button-row">

        <button onclick="formatText()">
            Format
        </button>

        <button onclick="copyOutput()">
            Copy
        </button>

    </div>

    <div id="output">
Formatted text appears here...
    </div>

</div>

<div class="footer" id="buyFooter">
    <a href="#" class="buy-button">
        Buy This Tool
    </a>
</div>

<script>

const userOwnsTool = false;

const footer =
    document.getElementById("buyFooter");

if(userOwnsTool){
    footer.style.display = "none";
}

const input =
    document.getElementById("input");

input.addEventListener("focus", () => {
    footer.style.display = "none";
});

input.addEventListener("blur", () => {
    if(!userOwnsTool){
        footer.style.display = "block";
    }
});

function formatText(){

    const raw =
        document.getElementById("input").value;

    const formatted =
        raw.replace(/\s+/g," ")
           .trim();

    document.getElementById("output").textContent =
        formatted;
}

function copyOutput(){

    const text =
        document.getElementById("output").textContent;

    navigator.clipboard.writeText(text);

}

</script>

</body>
</html>
